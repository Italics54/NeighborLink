<div class="submit-hero">
  <div class="pill">Community Settings</div>
  <h1>Change Your Community</h1>
  <p class="subtitle">
    Select the community you want to join. Some communities are not available yet.
  </p>
  
  <div class="user-box">
    <div class="avatar">
      {{ userName?.charAt(0) || 'U' }}
    </div>
    <div class="user-details">
      <h3>{{ userName }}</h3>
      <p>{{ userEmail }}</p>
    </div>
  </div>

  <form class="resource-form">
    <div class="form-group">
      <label>Select Community:</label>
      <div class="community-options">
        <button type="button" 
                class="community-btn available" 
                [class.selected]="selectedCommunity === 'roundrock'" 
                (click)="selectCommunity('roundrock')">
          Round Rock
        </button>

        <button type="button" 
                class="community-btn available" 
                [class.selected]="selectedCommunity === 'georgetown'" 
                (click)="selectCommunity('georgetown')">
          Georgetown
        </button>

        <button type="button" 
                class="community-btn locked" 
                (click)="notifyComingSoon('Austin')">
          Austin
        </button>
      </div>
    </div>

    <button type="submit" class="submit-btn" [disabled]="currentCommunityValue === selectedCommunity" (click)="saveCommunity()">
      Save Changes
    </button>
  </form>
</div>
