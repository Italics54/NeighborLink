<div class="chatbot-toggle" (click)="toggleChat()">
  💬
</div>

<div class="chatbot-panel" [class.open]="isChatOpen">
  <div class="chat-header">
    <span>Chatbot</span>
    <button (click)="toggleChat()">✕</button>
  </div>

  <div class="messages">
    <div *ngFor="let m of messages" [ngClass]="m.sender">
      <span>{{ m.text }}</span>
    </div>

    <div *ngIf="loading" class="bot">
      <span>Typing...</span>
    </div>
  </div>

  <div class="input-area">
    <input
      type="text"
      [(ngModel)]="messageText"
      (keyup.enter)="sendMessage()"
      placeholder="Type your message..."
    />
    <button (click)="sendMessage()">Send</button>
  </div>
</div>
