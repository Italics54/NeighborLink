<div class="story-page-container" *ngIf="post">
  <div class="story-hero">
    <h1>{{ post?.title }}</h1>
    <span class="story-category">{{ post?.category }}</span>
  </div>

  <button class="back-btn" (click)="goBack()">← Bak to Stories</button>

  <div class="story-content" [innerHTML]="post?.content"></div>
</div>

<div *ngIf="!post">
  <p>Story not found.</p>
</div>
