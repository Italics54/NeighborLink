<div class="story-page-container" *ngIf="post">
  <div class="story-hero">
    <h1>{{ post.title }}</h1>
    <span class="story-category">{{ post.category }}</span>
  </div>

  <button class="back-btn" (click)="goBack()">← Back to Stories</button>

  <div class="story-content" [innerHTML]="post.content"></div>
</div>

<button class="comments-fab" (click)="openComments()">
  💬 Comments
</button>
<div class="comments-panel" [class.open]="isCommentsOpen">
  <div class="comments-header">
    <h3>Comments</h3>
    <button class="avatar" (click)="openComments()">X</button>
  </div>
<div class="comments-input">
  <input
    type="text"
    placeholder="Write a comment..."
    [(ngModel)]="newComment"
  />
  <button (click)="addComment()">Post</button>
</div>
  <div class="comments-body">
    <div class="comment" *ngFor="let comment of post?.comments">
      <b>{{ comment.user}}</b>
      <p>{{ comment.text }}</p>
    </div>
  </div>
</div>

<div *ngIf="!post">
  <p>Story not found.</p>
</div>
