<div class="intro-overlay" [class.show]="showModal">
  <div class="intro-modal">

    <div class="intro-pill">WELCOME</div>

    <h2 class="gradient-text">How NeighborLink Works</h2>

    <p class="intro-text">
      Find local resources, events, and services in seconds.
    </p>

    <div class="intro-features">
      <div class="intro-feature">🔎 Search for nearby resources</div>
      <div class="intro-feature">📅 Discover community events</div>
      <div class="intro-feature">🤝 Connect with local services</div>
      <div class="intro-feature">⚡ AI powered recommendations</div>
    </div>

    <button class="intro-btn" (click)="closeModal()">
      Got it
    </button>

  </div>
</div>
